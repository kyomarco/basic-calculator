<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <h1 class="text-title">Basic Calculator</h1>
    <h2 class="text-description">Basic Calculator  created with Html, CSS, And Javascript.</h2>
    
    <div class="calculator">
        <div class="screen">0</div>
        <div class="calc-btn">
            <div class="list-btn">
                <button class="two-spaces">C</button>
                <button class="btn"><--</button>
                <button class="ops-btn">x</button>
            </div>
            <div class="list-btn">
                <button class="btn">9</button>
                <button class="btn">8</button>
                <button class="btn">7</button>
                <button class="ops-btn">/</button>
            </div>
            <div class="list-btn">
                <button class="btn">6</button>
                <button class="btn">5</button>
                <button class="btn">4</button>
                <button class="ops-btn">-</button>
            </div>
            <div class="list-btn">
                <button class="btn">3</button>
                <button class="btn">2</button>
                <button class="btn">1</button>
                <button class="ops-btn">+</button>
            </div>
            <div class="list-btn">
                <button class="three-spaces">0</button>
                <button class="ops-btn">=</button>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
